name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject tool-output contamination
        shell: bash
        run: |
          if grep -RInE '^\[Reading |^\[executed on device:|^Process started with PID|^Initial output:' src tests scripts; then
            echo 'Generated tool output was committed as source code.' >&2
            exit 1
          fi

      - name: Setup Rokit
        uses: paradoxum-games/setup-rokit@v3
        with:
          version: 1.2.0
          cache: true

      - name: Check formatting
        run: stylua --check src tests scripts

      - name: Lint
        run: selene src tests scripts

      - name: Build Rojo project
        run: rojo build default.project.json --output build.rbxlx

      - name: Run pure Luau tests
        run: lune run scripts/run-tests

      - name: Generate prelaunch economy report
        run: lune run scripts/economy-report

      - name: Report release readiness
        run: lune run scripts/release-readiness
